server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# LLM 配置使用OpenAI 兼容 API
spring:
  ai:
    openai:
      api-key: ${OnCallAgent_DEEPSEEK_API_KEY}  # 从环境变量读取或使用默认值
      base-url: https://api.deepseek.com/
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.5
          max-tokens: 2000
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    # mcp:
    #   client:
    #     enabled: true
    #     name: tencent-mcp-server
    #     version: 1.0.0
    #     request-timeout: 60s
    #     type: ASYNC
    #     sse:
    #       connections:
    #         tencent-cls:
    #           url: https://mcp-api.tencent-cloud.com
    #           sse-endpoint: /sse/92XXXXXXXXb4  # 完整的SSE端点路径

# Embedding 配置：阿里云 DashScope
dashscope:
  api:
    key: ${OnCallAgent_DASHSCOPE_API_KEY}   # 从环境变量读取或使用默认值
  embedding:
    model: qwen3.7-text-embedding

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "deepseek-v4-pro"  # DeepSeek 大语言模型

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）
